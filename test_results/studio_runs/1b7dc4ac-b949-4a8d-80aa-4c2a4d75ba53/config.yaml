arms:
  A1:
    config:
      d_ff: 512
      d_model: 192
      dropout: 0.1
      max_seq_len: 128
      n_heads: 4
      n_layers: 4
      vocab_size: 50257
    name: ExplicitLM
    optimizer: adamw
  A2:
    config:
      d_ff: 512
      d_model: 192
      deq_max_iter: 12
      deq_tol: 1e-3
      dropout: 0.1
      jfb: false
      max_seq_len: 128
      n_heads: 4
      solver: anderson
      vocab_size: 50257
    name: EqLM
    optimizer: adamw
  A3:
    config:
      d_ff: 512
      d_model: 192
      deq_max_iter: 12
      deq_tol: 1e-3
      dropout: 0.1
      jfb: false
      max_seq_len: 128
      n_heads: 4
      solver: anderson
      vocab_size: 50257
    magnetic_adamw_tau: 1e-2
    name: EqLM+MagneticAdamW
    optimizer: magnetic_adamw
data:
  batch_size: 32
  dataset: BabyLM-2026-Strict-Small
  seq_len: 128
  subset_size: 3300000
eval:
  blimp:
    cache_dir: ~/.cache/huggingface/hub
    num_phenomena: 5
    pairs_per_phenomenon: 200
tokenizer:
  prefer_gpt2: true
  vocab_size: 50257
training:
  grad_clip: 1.0
  log_every: 25
  lr: 3e-4
  num_epochs: 132
  num_steps: 10
  seed: 123
  warmup_steps: 0
  weight_decay: 0.01
