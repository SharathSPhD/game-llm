[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-ai"
version = "0.1.0"
description = "A unified library for game-theoretic LLM training: Magnetic Mirror Descent, Deep Equilibrium Models, and Mechanism Design."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sharath S", email = "sharath@example.com"},
]
keywords = [
    "game-theory",
    "llm",
    "magnetic-mirror-descent",
    "deep-equilibrium-models",
    "mechanism-design",
    "quantal-response-equilibrium",
    "self-play",
    "alignment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "types-PyYAML",
    "types-requests",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
experiments = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tqdm>=4.65",
    "tensorboard>=2.13",
]
all = ["kinetic-ai[dev,experiments,serve]"]

[project.urls]
Homepage = "https://github.com/SharathSPhD/game-llm"
Documentation = "https://sharathsphd.github.io/game-llm"
Repository = "https://github.com/SharathSPhD/game-llm"
Issues = "https://github.com/SharathSPhD/game-llm/issues"

[tool.setuptools.packages.find]
include = ["kinetic_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "convergence: marks convergence benchmark tests",
]

[tool.mypy]
python_version = "3.12"  # analysis version; numpy>=2 stubs need 3.12 `type` statements
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["transformers"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tokenizers",
    "tokenizers.models",
    "tokenizers.normalizers",
    "tokenizers.pre_tokenizers",
    "tokenizers.processors",
    "tokenizers.trainers",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["datasets"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N806", "N812"]  # uppercase math vars & torch F import are idiomatic in numerical code
