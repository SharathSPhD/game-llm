        - heading "Technical Notes" [level=2] [ref=e90]
        - list [ref=e91]:
          - listitem [ref=e92]:
            - strong [ref=e93]: "Backend:"
            - text: FastAPI server (app/server.py) handles /api/solve, /api/qre_path, /api/auction, /api/jobs endpoints. Authentication via bearer token (GATEWAY_SECRET).
          - listitem [ref=e94]:
            - strong [ref=e95]: "Frontend:"
            - text: Next.js 14 (app router) + React 18 + TailwindCSS. API proxy routes forward requests to gateway; replay mode serves canned demo data when offline.
          - listitem [ref=e96]:
            - strong [ref=e97]: "Auth:"
            - text: Supabase SSR (optional). When NEXT_PUBLIC_SUPABASE_URL is set, sessions are maintained; otherwise auth softly disables and all pages are readable.
          - listitem [ref=e98]:
            - strong [ref=e99]: "Reproducibility:"
            - text: Results stored in results/ directory; each experiment includes config hash, seed, and git commit. Tarka verification gates sign-off.
          - listitem [ref=e100]:
            - strong [ref=e101]: "Deployment:"
            - text: "Vercel (root dir apps/web). Environment variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, GATEWAY_URL, GATEWAY_SECRET."
