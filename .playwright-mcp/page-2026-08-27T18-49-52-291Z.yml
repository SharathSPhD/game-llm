            - heading "Equilibrium Lab" [level=3] [ref=e75]
            - paragraph [ref=e76]: Run MMD, GDA, and QRE solvers on RPS, matching pennies, and biased games. Tune learning rate, magnetic strength, and step count; watch strategies converge.
          - link [ref=e77] [cursor=pointer]:
            - /url: /qre
            - heading "QRE Explorer" [level=3] [ref=e78]
            - paragraph [ref=e79]: Trace quantal response paths as rationality varies. See how agents shift from uniform randomness to best-response play; measure exploitability along the path.
          - link [ref=e80] [cursor=pointer]:
            - /url: /auction
            - heading "Auction Playground" [level=3] [ref=e81]
            - paragraph [ref=e82]: Design multi-agent token auctions. Compare second-price (truthful) vs. weighted aggregation; measure manipulation regret and output distributions.
          - link [ref=e83] [cursor=pointer]:
            - /url: /studio
            - heading "Training Studio" [level=3] [ref=e84]
            - paragraph [ref=e85]: "Submit long-running jobs: solve-and-audit, ablations, hyperparameter sweeps. Monitor status, download results, and trace config hashes to reproducible runs."
          - link [ref=e86] [cursor=pointer]:
