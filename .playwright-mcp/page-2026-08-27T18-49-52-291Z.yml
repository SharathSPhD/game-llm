      - generic [ref=e49]:
        - heading "The Research Program" [level=2] [ref=e50]
        - generic [ref=e51]:
          - generic [ref=e52]:
            - heading "Convergence to Equilibrium" [level=3] [ref=e53]
            - paragraph [ref=e54]: "Beyond GDA's cycling behavior: Magnetic Mirror Descent with fixed or adaptive references reaches equilibrium on symmetric and asymmetric games. We trace the geometry of fixed points and validate log-linear convergence."
          - generic [ref=e55]:
            - heading "QRE Homotopy" [level=3] [ref=e56]
            - paragraph [ref=e57]: Quantal response equilibria interpolate between randomness and perfect rationality. Warm-started homotopy paths accelerate solver convergence; adaptive damping handles high-rationality limits.
          - generic [ref=e58]:
            - heading "Mechanism Truthfulness" [level=3] [ref=e59]
            - paragraph [ref=e60]: "Token auctions studied via second-price vs. weighted aggregation. Empirical regret validates truthfulness: second-price is VCG-exact, weighted aggregation enables profitable manipulation."
          - generic [ref=e61]:
            - heading "Reproducible Science" [level=3] [ref=e62]
            - paragraph [ref=e63]: Every result includes config hash, seed, git commit. Tarka verification gates findings; intermediate artifacts are stored and indexed. Full audit trail from hypothesis to sign-off.
          - generic [ref=e64]:
            - heading "GPU Acceleration" [level=3] [ref=e65]
            - paragraph [ref=e66]: Training Studio orchestrates long-running jobs on CUDA. Experiments marshal PyTorch tensors, leverage implicit differentiation (DEQ), and track memory-efficient solver stacks.
          - generic [ref=e67]:
            - heading "Interactive Exploration" [level=3] [ref=e68]
            - paragraph [ref=e69]: "Tune hyperparameters in real time: method, learning rate, magnetic strength, rationality range. Animated convergence plots and strategy simplexes bring game dynamics to life."
