data:
  dataset: BabyLM-2026-Strict-Small
  max_tokens: 1300000
  seq_len: 128
decode_probe:
  max_new_tokens: 25
  num_prompts: 40
eval:
  blim_pairs: 500
  eval_tol: 0.01
  max_iters:
  - 6
  - 12
  - 24
  - 48
log_interval: 1
model:
  aux_residual: true
  d_ff: 538
  d_model: 204
  deq_max_iter: 24
  deq_tol: 1e-2
  dropout: 0.1
  lambda_aux: 0.01
  map_form: postln
  max_seq_len: 128
  n_heads: 4
  residual_damping: 0.2
  solver: anderson
  spectral_norm: true
  vocab_size: 50257
output_dir: results/exp09_adaptive
tokenizer:
  vocab_size: 50257
training:
  batch_size: 32
  grad_clip: 1.0
  log_every: 1
  lr: 1e-4
  num_steps: 500
  seed: 42
