# EXP09 SMOKE: Adaptive-Equilibrium Program (H1′)
# Measures: (i) warm-start decoding iterations, (ii) per-token early-exit,
# (iii) eval-time budget scaling, (iv) residual vs error correlation
#
# CPU dry-run config: minimal steps to verify end-to-end pipeline works

data:
  dataset: "BabyLM-2026-Strict-Small"
  max_tokens: 20000  # Small for CPU smoke test (20k tokens)
  seq_len: 128

tokenizer:
  vocab_size: 50257

training:
  seed: 42
  num_steps: 3  # CPU smoke: just 3 steps to verify pipeline
  batch_size: 2
  log_every: 1
  lr: 1e-4
  grad_clip: 1.0

model:
  vocab_size: 50257
  d_model: 64      # Tiny for smoke test
  n_heads: 2
  d_ff: 256
  max_seq_len: 128
  deq_max_iter: 12
  deq_tol: 1e-2
  solver: "anderson"
  dropout: 0.1
  residual_damping: 0.2
  map_form: "postln"
  spectral_norm: true
  aux_residual: true
  lambda_aux: 0.01

# Evaluation config: budget scaling for H1′c
eval:
  blim_pairs: 50  # Tiny eval set for smoke (50 pairs)
  max_iters: [6, 12]  # Eval-time budget scaling: {6, 12} (not full {12,24,48} for smoke)
  eval_tol: 1e-2

# Output
output_dir: "results/exp09_adaptive"
log_interval: 1
