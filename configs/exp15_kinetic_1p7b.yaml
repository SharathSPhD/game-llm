# H7 (SPEC 0011): KineticLM uptraining at the F25-selected operating point.
seed: 42
device: cuda
base_model: Qwen/Qwen3-1.7B
kinetic:
  n_pre: 8
  n_post: 8
  n_cores: 1
  init_strategy: average
  anytime_depths: [6, 12]      # budget dial targets (full depth = 12)
data:
  dataset: HuggingFaceFW/fineweb-edu
  name: sample-10BT
  split: train
  seq_len: 1024
  max_tokens: 130000000        # ~130M tokens cached; the run consumes ~98M
  heldout_batches: 16
  cache_dir: data/scale_cache
training:
  num_steps: 6000
  batch_size: 4
  grad_accum: 4          # same effective batch, safer in 32GB with a resident teacher
  seq_len: 1024
  lr: 2e-4
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_frac: 0.02
  alpha_kl: 0.7                # teacher distillation dominates recovery
  kd_temp: 1.0
  anytime_prob: 0.25           # ours: stochastic reduced-depth supervision
  anytime_weight: 0.3
  gradient_checkpointing: true
  log_every: 20
  eval_every: 500
