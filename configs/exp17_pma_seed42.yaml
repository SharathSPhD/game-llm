# H8 (SPEC 0012): PMA vs DPO at 1.7B — seed 42
seed: 42
device: cuda
base_model: Qwen/Qwen3-1.7B

data:
  dataset_name: HuggingFaceH4/ultrafeedback_binarized
  split: train_sft
  # Split: ~60k pairs, held-out ~6k for eval
  heldout_frac: 0.1

training:
  # SPEC 0012: ~2k steps per arm on 5090 (4–8h total)
  num_steps: 2000
  batch_size: 8
  # SPEC 0012: lr in [5e-7, 1e-6] scaled from Qwen3 instruct tuning
  lr: 1e-6
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_frac: 0.02
  gradient_checkpointing: true
  log_every: 50

# Pre-registered arms per SPEC 0012
arms:
  # D1: baseline DPO (tau=0, identical to decoupled AdamW)
  D1_dpo:
    optimizer_type: dpo
    tau: 0.0

  # D2: PMA arm A — tau=1e-4
  # Displacement: lr * tau * steps = 1e-6 * 1e-4 * 2000 = 2e-7
  D2_pma_t1e4:
    optimizer_type: pma
    tau: 1e-4

  # D2: PMA arm B — tau=1e-3
  # Displacement: lr * tau * steps = 1e-6 * 1e-3 * 2000 = 2e-6
  D2_pma_t1e3:
    optimizer_type: pma
    tau: 1e-3

  # D2: PMA arm C — tau=1e-2
  # Displacement: lr * tau * steps = 1e-6 * 1e-2 * 2000 = 2e-5
  D2_pma_t1e2:
    optimizer_type: pma
    tau: 1e-2

  # D3: SimPO (if available in installed TRL; otherwise OMITTED)
  # To use: configure D3_simpo with optimizer_type: simpo
  # When unavailable, delete this entry and see exp17 docstring.
  # D3_simpo:
  #   optimizer_type: simpo
