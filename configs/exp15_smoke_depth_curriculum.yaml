seed: 42
device: cuda
base_model: Qwen/Qwen3-1.7B
kinetic:
  n_pre: 8
  n_post: 8
  n_cores: 1
  init_strategy: average
  anytime_depths:
  - 6
data:
  dataset: HuggingFaceFW/fineweb-edu
  name: sample-10BT
  split: train
  seq_len: 512
  max_tokens: 400000
  heldout_batches: 2
  cache_dir: data/scale_cache
training:
  num_steps: 12
  batch_size: 2
  grad_accum: 1
  lr: 2e-4
  weight_decay: 0.01
  grad_clip: 1.0
  alpha_kl: 0.7
  anytime_prob: 0.5
  anytime_weight: 0.3
  gradient_checkpointing: true
  log_every: 2
  eval_every: 0
  curriculum_lam0: 1.0
  curriculum_lam1: 0.5
arm: depth_curriculum
